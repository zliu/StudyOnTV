name: PR 检查

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    name: 编译检查
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: parent-ui/package-lock.json

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'

      - name: 安装 parent-ui 依赖
        working-directory: parent-ui
        run: npm ci

      - name: 构建 parent-ui（生成 admin/，Android 编译依赖它）
        working-directory: parent-ui
        run: npm run build

      - name: 运行单元测试并编译 TV + Mobile Debug APK（无需签名）
        working-directory: app/native
        run: gradle testTvDebugUnitTest testMobileDebugUnitTest assembleTvDebug assembleMobileDebug --no-daemon

  ui-check:
    name: 前端类型检查
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: parent-ui/package-lock.json

      - name: 安装依赖
        working-directory: parent-ui
        run: npm ci

      - name: 运行测试（含 TypeScript 类型检查）
        working-directory: parent-ui
        run: npm test
