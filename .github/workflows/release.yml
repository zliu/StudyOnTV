name: 构建并发布 Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: 构建 APK 并发布
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写权限：上传 Release 资产 + commit update.json
    env:
      # step 的 if 只能用 env 判断，不能直接引用 secrets（否则整个工作流校验不过）
      PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要能 push commit（update.json），用 PAT 或默认 token + 写权限
          token: ${{ secrets.GITHUB_TOKEN }}
          # 浅克隆会把附注标签压成轻量标签，%(contents) 就读不到发版说明，只剩 commit 正文
          fetch-depth: 0
          # checkout@v4 默认不拉标签，只给触发的那一个 ref 建轻量标签；必须显式拉下来
          fetch-tags: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: parent-ui/package-lock.json

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'   # 与项目 gradle-wrapper 版本一致，无需 gradlew 文件

      # ── 1. 构建家长面板 → 输出到 admin/ ──────────────────────────────
      - name: 安装 parent-ui 依赖
        working-directory: parent-ui
        run: npm ci

      - name: 运行 parent-ui 测试与类型检查
        working-directory: parent-ui
        run: npm test

      - name: 构建 parent-ui（输出到 admin/）
        working-directory: parent-ui
        run: npm run build

      # ── 2. 解码签名密钥 ───────────────────────────────────────────────
      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/keystore.jks"

      - name: 写入 local.properties
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          CRASH_ENDPOINT: ${{ secrets.CRASH_ENDPOINT }}
          CRASH_TOKEN: ${{ secrets.CRASH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_prop(val: str) -> str:
              out = []
              for idx, ch in enumerate(val):
                  if ch == "\\":
                      out.append("\\\\")
                  elif ch == "\t":
                      out.append("\\t")
                  elif ch == "\n":
                      out.append("\\n")
                  elif ch == "\r":
                      out.append("\\r")
                  elif ch == "\f":
                      out.append("\\f")
                  elif ch == " " and idx == 0:
                      out.append("\\ ")
                  elif ch in ":=#!":
                      out.append("\\" + ch)
                  elif ord(ch) < 0x20 or ord(ch) > 0x7E:
                      out.append(f"\\u{ord(ch):04x}")
                  else:
                      out.append(ch)
              return "".join(out)

          entries = [
              ("sdk.dir", os.environ.get("ANDROID_SDK_ROOT", "")),
              ("KEYSTORE_PATH", os.environ.get("KEYSTORE_PATH", "")),
              ("KEYSTORE_PASS", os.environ.get("KEYSTORE_PASS", "")),
              ("KEY_ALIAS", os.environ.get("KEY_ALIAS", "")),
              ("KEY_PASS", os.environ.get("KEY_PASS", "")),
              ("CRASH_ENDPOINT", os.environ.get("CRASH_ENDPOINT", "")),
              ("CRASH_TOKEN", os.environ.get("CRASH_TOKEN", "")),
          ]
          content = "".join(f"{k}={escape_prop(v)}\n" for k, v in entries)
          Path("app/native/local.properties").write_text(content, encoding="ascii")
          PY

      # ── 3. 测试与构建 Android APK ─────────────────────────────────────
      - name: 运行 Android 单元测试
        working-directory: app/native
        run: gradle testTvDebugUnitTest testMobileDebugUnitTest --no-daemon

      - name: 构建 TV Release APK
        working-directory: app/native
        run: gradle assembleTvRelease --no-daemon

      - name: 构建 Mobile Release APK
        working-directory: app/native
        run: gradle assembleMobileRelease --no-daemon

      # ── 4. 整理产物，重命名为发布文件名 ─────────────────────────────
      - name: 整理产物
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p release-artifacts
          cp app/native/app/build/outputs/apk/tv/release/app-tv-release.apk \
             release-artifacts/StudyOnTV-Android-TV-${TAG}.apk
          cp app/native/app/build/outputs/apk/mobile/release/app-mobile-release.apk \
             release-artifacts/StudyOnTV-Mobile-${TAG}.apk
          echo "TAG=${TAG}" >> $GITHUB_ENV

      # ── 5. 生成 update.json ──────────────────────────────────────────
      - name: 生成 update.json
        run: |
          # 从附注标签的完整说明作为更新说明（git tag -a v0.x.x -F 说明.txt）
          # 用 %(contents) 取全文：标签说明没写空行时 %(contents:body) 是空的
          NOTES=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || echo "")
          node scripts/make-update-manifest.mjs release-artifacts --notes "$NOTES"

      # ── 6. 发布到 GitHub Release（先上传资产，避免 update.json 指向 404）──
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          fail_on_unmatched_files: true

      # ── 7. commit update.json 回 main ────────────────────────────────
      - name: Commit update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp update.json "$RUNNER_TEMP/update.json"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/update.json" update.json
          git add update.json
          git diff --staged --quiet || git commit -m "release: ${TAG} 更新清单 [skip ci]"
          git push origin main

      # ── 8. 上传到蒲公英（备用下载）────────────────────────────────────
      - name: 上传 Mobile APK 到蒲公英
        if: env.PGYER_API_KEY != ''
        run: |
          NOTES=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || echo "")
          curl -s --fail-with-body \
            -F "_api_key=${PGYER_API_KEY}" \
            -F "file=@release-artifacts/StudyOnTV-Mobile-${TAG}.apk" \
            -F "buildUpdateDescription=${NOTES}" \
            "https://www.pgyer.com/apiv2/app/upload" | tee pgyer-mobile.json
          cat pgyer-mobile.json | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('code')==0 else 1)"

      - name: 上传 TV APK 到蒲公英
        if: env.PGYER_API_KEY != ''
        run: |
          NOTES=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || echo "")
          curl -s --fail-with-body \
            -F "_api_key=${PGYER_API_KEY}" \
            -F "file=@release-artifacts/StudyOnTV-Android-TV-${TAG}.apk" \
            -F "buildUpdateDescription=${NOTES}" \
            "https://www.pgyer.com/apiv2/app/upload" | tee pgyer-tv.json
          cat pgyer-tv.json | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('code')==0 else 1)"

      # ── 9. 清理签名密钥与临时配置 ────────────────────────────────────
      - name: 清理签名密钥与 local.properties
        if: always()
        run: rm -f "${{ runner.temp }}/keystore.jks" app/native/local.properties
